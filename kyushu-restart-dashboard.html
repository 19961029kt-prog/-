/* ---------- Data ---------- */

  { range: "15-30分", percent: 10 },
  { range: "30分以上", percent: 5 },

/* ---------- Pure CSS/SVG Charts (CDN依存なし) ---------- */
function DonutChart({ data, colors, size = 200, thickness = 32 }) {
  const radius = size / 2;
  const innerRadius = radius - thickness;
  const center = radius;
  let cumulative = 0;

  const segments = data.map((d, idx) => {
    const startAngle = (cumulative / 100) * 360;
    cumulative += d.value;
    const endAngle = (cumulative / 100) * 360;
    return { ...d, startAngle, endAngle, color: colors[idx % colors.length] };
  });

  const polarToCartesian = (angleDeg, r) => {
    const angleRad = ((angleDeg - 90) * Math.PI) / 180;
    return { x: center + r * Math.cos(angleRad), y: center + r * Math.sin(angleRad) };
  };

  const arcPath = (startAngle, endAngle) => {
    const startOuter = polarToCartesian(startAngle, radius);
    const endOuter = polarToCartesian(endAngle, radius);
    const startInner = polarToCartesian(endAngle, innerRadius);
    const endInner = polarToCartesian(startAngle, innerRadius);
    const largeArc = endAngle - startAngle > 180 ? 1 : 0;
    return [
      `M ${startOuter.x} ${startOuter.y}`,
      `A ${radius} ${radius} 0 ${largeArc} 1 ${endOuter.x} ${endOuter.y}`,
      `L ${startInner.x} ${startInner.y}`,
      `A ${innerRadius} ${innerRadius} 0 ${largeArc} 0 ${endInner.x} ${endInner.y}`,
      "Z",
    ].join(" ");
  };

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {segments.map((seg) => (
        <path
          key={seg.name}
          d={arcPath(seg.startAngle, seg.endAngle)}
          fill={seg.color}
          stroke="#fff"
          strokeWidth="2"
        >
          <title>{`${seg.name}: ${seg.value}%`}</title>
        </path>
      ))}
    </svg>
  );
}

function BarChartSimple({ data, dataKey, labelKey, highlightFirst = true }) {
  const max = Math.max(...data.map((d) => d[dataKey]));
  return (
    <div className="flex items-end justify-between gap-3 h-56 px-2">
      {data.map((d, idx) => {
        const heightPct = (d[dataKey] / max) * 100;
        const isHighlight = highlightFirst && idx === 0;
        return (
          <div key={d[labelKey]} className="flex flex-col items-center flex-1 h-full justify-end">
            <span className="text-xs font-semibold text-gray-700 mb-1">{d[dataKey]}%</span>
            <div
              className="w-full rounded-t-md transition-all"
              style={{
                height: `${heightPct}%`,
                backgroundColor: isHighlight ? GOLD : GOLD_LIGHT,
                opacity: isHighlight ? 1 : 0.55,
                minHeight: "4px",
              }}
            />
            <span className="text-xs text-gray-400 mt-2 text-center">{d[labelKey]}</span>
          </div>
        );
      })}
    </div>
  );
}

  );
}
