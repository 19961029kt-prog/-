<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>図面差分チェッカー</title>
<meta name="description" content="旧版と新版の図面PDFを重ねて、削除=赤・追加=青で変更点をハイライトします。CAD出力の超長尺図面・スキャン図面に対応。処理はすべてブラウザ内で行い、ファイルは送信されません。">
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f3;
  --border: #d9dde3;
  --text: #1c2128;
  --muted: #5f6873;
  --accent: #1f6feb;
  --accent-text: #ffffff;
  --removed: #e60000;
  --added: #005ae6;
  --changed: #7a3db8;
  --box: #ff9600;
  --note: #9a4a00;
  --warn-bg: #fff6e0;
  --warn-text: #7a5300;
  --err-bg: #fde8e8;
  --err-text: #9b1c1c;
  --viewer-bg: #e3e6ea;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b;
    --surface: #1d2126;
    --surface-2: #262b31;
    --border: #353b43;
    --text: #e6e9ed;
    --muted: #9aa3ad;
    --accent: #4c8dff;
    --accent-text: #0b1220;
    --note: #ffb36b;
    --warn-bg: #3a2f12;
    --warn-text: #f3d48a;
    --err-bg: #3d1a1a;
    --err-text: #f5b4b4;
    --viewer-bg: #0f1215;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b;
  --surface: #1d2126;
  --surface-2: #262b31;
  --border: #353b43;
  --text: #e6e9ed;
  --muted: #9aa3ad;
  --accent: #4c8dff;
  --accent-text: #0b1220;
  --note: #ffb36b;
  --warn-bg: #3a2f12;
  --warn-text: #f3d48a;
  --err-bg: #3d1a1a;
  --err-text: #f5b4b4;
  --viewer-bg: #0f1215;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  font-size: 15px;
  line-height: 1.6;
}
main { max-width: 1440px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: .02em; }
.lead { color: var(--muted); margin: 0 0 20px; }
.privacy {
  display: inline-flex; gap: 6px; align-items: center;
  font-size: 13px; color: var(--muted);
  background: var(--surface-2); border-radius: 999px; padding: 3px 12px; margin-bottom: 20px;
}
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; margin-bottom: 16px;
}
.step-title { font-size: 15px; font-weight: 700; margin: 0 0 12px; }
.files { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .files { grid-template-columns: 1fr; } }
.drop {
  border: 2px dashed var(--border); border-radius: 10px; padding: 18px;
  text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  min-height: 112px; display: flex; flex-direction: column; justify-content: center; gap: 4px;
}
.drop:hover, .drop.over { border-color: var(--accent); background: var(--surface-2); }
.drop.ready { border-style: solid; }
.drop .tag { font-weight: 700; font-size: 16px; }
.drop.old .tag { color: var(--removed); }
.drop.new .tag { color: var(--added); }
.drop .name { font-size: 13px; color: var(--muted); word-break: break-all; }
.drop input { display: none; }
.row { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
select, input[type=number] {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; min-width: 120px;
}
.kindinfo { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 1.6em; }
.kindinfo b { color: var(--text); }
.presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.presets.off { display: none; }
.preset {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 10px; padding: 8px 14px; cursor: pointer; font: inherit; text-align: left;
}
.preset small { display: block; color: var(--muted); font-size: 12px; }
.preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
details { margin-top: 14px; }
summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.adv { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 12px; }
.adv .hint { font-size: 12px; color: var(--muted); }
button.primary {
  font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 10px;
  background: var(--accent); color: var(--accent-text); padding: 12px 28px; cursor: pointer;
}
button.primary:disabled { opacity: .45; cursor: not-allowed; }
button.ghost {
  font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
button.ghost:disabled { opacity: .45; cursor: not-allowed; }
button.ghost[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.progress { margin-top: 14px; display: none; }
.progress.on { display: block; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.progress .msg { font-size: 13px; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; align-items: center; }
.notice { border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: 14px; display: none; }
.notice.on { display: block; }
.notice.warn { background: var(--warn-bg); color: var(--warn-text); }
.notice.err { background: var(--err-bg); color: var(--err-text); }
#result { display: none; }
#result.on { display: block; }
.summary { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 14px; min-width: 110px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); align-items: center; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.toolbar .sp { flex: 1; }
.zoomval { font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; font-size: 13px; color: var(--muted); }
.viewport {
  background: var(--viewer-bg); border-radius: 10px; overflow: auto; height: 70vh; min-height: 140px;
  cursor: grab; position: relative; width: 100%;
}
.viewport.drag { cursor: grabbing; }
.stage { position: relative; }
.stage canvas { position: absolute; left: 0; top: 0; display: block; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
.ob { position: absolute; border: 2px solid var(--box); border-radius: 2px; min-width: 8px; min-height: 8px; }
.ob span {
  position: absolute; left: -2px; bottom: 100%; background: var(--box); color: #fff;
  font-size: 11px; font-weight: 700; line-height: 1; padding: 2px 4px; border-radius: 3px 3px 0 0;
}
.ob.sel { border-width: 3px; box-shadow: 0 0 0 3px rgba(255,150,0,.35); }
.list { max-height: calc(70vh + 44px); overflow: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: top; }
th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
td.note { white-space: normal; color: var(--note); font-size: 12px; padding-top: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover, tbody tr.sel { background: var(--surface-2); }
.chip { display: inline-block; border-radius: 6px; padding: 0 6px; font-size: 12px; color: #fff; }
.chip.removed { background: var(--removed); }
.chip.added { background: var(--added); }
.chip.changed { background: var(--changed); }
.num { font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
.howto { font-size: 14px; color: var(--muted); }
#detail { display: none; margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; }
#detail.on { display: block; }
.dhead { font-weight: 700; }
.dnote { color: var(--note); font-size: 13px; margin: 2px 0 8px; word-break: break-all; }
.dview { background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: auto; max-height: 75vh; position: relative; }
.dview canvas { display: block; }
.dbusy { color: var(--muted); font-size: 13px; padding: 24px; }
</style>
</head>
<body>
<main>
  <h1>図面差分チェッカー</h1>
  <p class="lead">旧版と新版の図面PDFを重ね、<b style="color:var(--removed)">削除＝赤</b>、<b style="color:var(--added)">追加＝青</b>で変更点をハイライトします。CADから出力した超長尺・極小文字の図面にも、スキャン図面にも使えます。</p>
  <div class="privacy">🔒 図面はこのPCのブラウザ内だけで処理されます。どこにも送信されません。</div>

  <section class="card">
    <p class="step-title">① 図面PDFを選ぶ</p>
    <div class="files">
      <label class="drop old" id="dropOld">
        <span class="tag">旧版（変更前）</span>
        <span class="name" id="nameOld">クリックして選択、またはここにドロップ</span>
        <input type="file" accept="application/pdf,.pdf" id="fileOld">
      </label>
      <label class="drop new" id="dropNew">
        <span class="tag">新版（変更後）</span>
        <span class="name" id="nameNew">クリックして選択、またはここにドロップ</span>
        <input type="file" accept="application/pdf,.pdf" id="fileNew">
      </label>
    </div>
  </section>

  <section class="card">
    <p class="step-title">② 比べ方を選ぶ</p>
    <div class="row">
      <label class="field">図面の種類
        <select id="kind">
          <option value="auto" selected>自動判定</option>
          <option value="cad">CADから出力したPDF</option>
          <option value="scan">スキャンした図面</option>
        </select>
      </label>
      <label class="field">解像度
        <select id="dpi">
          <option value="0" selected>自動（おすすめ）</option>
          <option value="150">150 dpi</option>
          <option value="200">200 dpi</option>
          <option value="300">300 dpi</option>
          <option value="400">400 dpi</option>
          <option value="600">600 dpi</option>
          <option value="800">800 dpi（重い）</option>
          <option value="1200">1200 dpi（とても重い）</option>
        </select>
      </label>
      <label class="field">比較するページ
        <select id="page" disabled><option>—</option></select>
      </label>
    </div>
    <div class="kindinfo" id="kindInfo"></div>
    <div class="presets" id="presets">
      <button type="button" class="preset" data-preset="standard" aria-pressed="true">標準<small>まずはこれ</small></button>
      <button type="button" class="preset" data-preset="sensitive" aria-pressed="false">細かく拾う<small>小さな変更を見逃したくない</small></button>
      <button type="button" class="preset" data-preset="robust" aria-pressed="false">ノイズに強く<small>汚れ・ズレが多いスキャン</small></button>
    </div>
    <details>
      <summary>詳細設定</summary>
      <div class="adv">
        <label class="field">ズレの許容幅 (px)
          <input type="number" id="tolerance" min="0" max="30" value="3">
          <span class="hint">スキャン図面用。上げる＝線の縁の誤検出が減る</span>
        </label>
        <label class="field">無視する小さな差分 (px²)
          <input type="number" id="minArea" min="0" max="5000" value="30">
          <span class="hint">スキャン図面用。上げる＝ゴミ点を無視</span>
        </label>
        <label class="field">点ノイズ除去 (px)
          <input type="number" id="openK" min="0" max="5" value="2">
          <span class="hint">スキャン図面用。0＝しない</span>
        </label>
        <label class="field">線の濃さのしきい値
          <input type="number" id="threshold" min="0" max="254" value="0">
          <span class="hint">0＝自動。薄い線を拾うなら 200 前後</span>
        </label>
        <label class="field">枠にまとめる距離 (px)
          <input type="number" id="cluster" min="1" max="500" value="40">
          <span class="hint">上げる＝近くの変更を1つの枠に</span>
        </label>
        <label class="field">位置合わせ
          <select id="align">
            <option value="1" selected>自動で合わせる</option>
            <option value="0">しない</option>
          </select>
          <span class="hint">px の数値は 300dpi 基準で自動換算</span>
        </label>
        <label class="field">文字の比較
          <select id="textcmp">
            <option value="1" selected>する（CAD図面）</option>
            <option value="0">しない</option>
          </select>
          <span class="hint">PDF内の文字列と位置で比べる</span>
        </label>
      </div>
    </details>
  </section>

  <section class="card">
    <p class="step-title">③ 比較する</p>
    <div class="row">
      <button class="primary" id="run" disabled>比較する</button>
      <span class="howto" id="runHint">旧版と新版の両方を選んでください</span>
    </div>
    <div class="progress" id="progress">
      <div class="bar"><div id="barFill"></div></div>
      <div class="msg"><span id="progMsg"></span><button class="ghost" id="cancel" style="padding:2px 10px;font-size:12px">中止</button></div>
    </div>
    <div class="notice warn" id="warn"></div>
    <div class="notice err" id="err"></div>
  </section>

  <section class="card" id="result">
    <div class="summary" id="summary"></div>
    <div class="legend" style="margin-bottom:12px">
      <span><span class="sw" style="background:var(--removed)"></span>削除（旧版のみ）</span>
      <span><span class="sw" style="background:var(--added)"></span>追加（新版のみ）</span>
      <span><span class="sw" style="background:#c8c8c8"></span>変更なし</span>
      <span><span class="sw" style="background:var(--box)"></span>変更箇所（番号）</span>
    </div>
    <div class="layout">
      <div>
        <div class="toolbar">
          <button class="ghost" id="zoomFit">全体</button>
          <button class="ghost" id="zoomH" hidden>高さに合わせる</button>
          <button class="ghost" id="zoomOut" aria-label="縮小">－</button>
          <span class="zoomval" id="zoomVal">100%</span>
          <button class="ghost" id="zoomIn" aria-label="拡大">＋</button>
          <span class="sp"></span>
          <button class="ghost" id="prevPage">◀ 前のページ</button>
          <button class="ghost" id="nextPage">次のページ ▶</button>
        </div>
        <div class="viewport" id="viewport"><div class="stage" id="stage"><div class="overlay" id="overlay"></div></div></div>
        <div class="row" style="margin-top:10px">
          <button class="ghost" id="dlPng">全体図を保存 (PNG)</button>
          <button class="ghost" id="dlCsv">変更箇所一覧を保存 (CSV)</button>
          <span class="howto">ドラッグで移動、Ctrl＋ホイールで拡大縮小</span>
        </div>
      </div>
      <div>
        <p class="step-title" style="margin-bottom:6px">変更箇所一覧</p>
        <div class="howto" style="font-size:12px;margin-bottom:6px">クリックで拡大図を表示。位置は図面左上からの mm</div>
        <div class="list" id="list"></div>
      </div>
    </div>
    <div id="detail">
      <div class="toolbar">
        <span class="dhead" id="dTitle"></span>
        <span class="sp"></span>
        <button class="ghost" data-dmode="diff" aria-pressed="true">差分</button>
        <button class="ghost" data-dmode="old" aria-pressed="false">旧版</button>
        <button class="ghost" data-dmode="new" aria-pressed="false">新版</button>
        <button class="ghost" id="dZoom">原寸</button>
        <button class="ghost" id="dPrev">◀ 前の箇所</button>
        <button class="ghost" id="dNext">次の箇所 ▶</button>
      </div>
      <div class="dnote" id="dNote"></div>
      <div class="dview" id="dView"><canvas id="dCanvas"></canvas></div>
    </div>
  </section>
</main>

<script src="vendor/pdfjs-3.11.174/pdf.min.js"></script>

<!-- 画像処理はページを固めないよう Web Worker で実行する -->
<script id="workerSrc" type="text/plain">
'use strict';
const post = (o, t) => self.postMessage(o, t || []);

self.onmessage = (e) => {
  const d = e.data;
  try {
    if (d.cmd === 'prepare') prepare(d);
    else if (d.cmd === 'tile') tile(d);
    else if (d.cmd === 'finish') finish(d);
  } catch (err) { post({ id: d.id, error: String((err && err.stack) || err) }); }
};

// ---------- 基本処理 ----------
function blur3(src, w, h) {
  const tmp = new Uint16Array(w * h), out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    const r = y * w;
    for (let x = 0; x < w; x++) {
      tmp[r + x] = src[r + (x > 0 ? x - 1 : 0)] + src[r + x] + src[r + (x < w - 1 ? x + 1 : x)];
    }
  }
  for (let y = 0; y < h; y++) {
    const up = (y > 0 ? y - 1 : 0) * w, me = y * w, dn = (y < h - 1 ? y + 1 : y) * w;
    for (let x = 0; x < w; x++) out[me + x] = ((tmp[up + x] + tmp[me + x] + tmp[dn + x]) / 9 + 0.5) | 0;
  }
  return out;
}
function otsu(img) {
  const hist = new Float64Array(256);
  for (let i = 0; i < img.length; i++) hist[img[i]]++;
  const total = img.length;
  let sum = 0; for (let t = 0; t < 256; t++) sum += t * hist[t];
  let sumB = 0, wB = 0, best = 0, thr = 127;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue;
    const wF = total - wB; if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF, b = wB * wF * (mB - mF) * (mB - mF);
    if (b > best) { best = b; thr = t; }
  }
  return thr;
}
// 線・記号（暗い画素）=1、背景=0
function inkMask(gray, w, h, blur, thr) {
  const g = blur ? blur3(gray, w, h) : gray;
  const m = new Uint8Array(w * h);
  for (let i = 0; i < m.length; i++) m[i] = g[i] <= thr ? 1 : 0;
  return m;
}
// 窓 [i-a, i+b] 内に 1 があれば 1（行方向→列方向の分離型の膨張）
function dilate(src, w, h, r) {
  if (r <= 0) return src;
  const tmp = new Uint8Array(w * h), out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    const row = y * w; let c = 0;
    for (let k = 0; k <= r && k < w; k++) c += src[row + k];
    for (let x = 0; x < w; x++) {
      tmp[row + x] = c > 0 ? 1 : 0;
      if (x + r + 1 < w) c += src[row + x + r + 1];
      if (x - r >= 0) c -= src[row + x - r];
    }
  }
  const cnt = new Uint16Array(w);
  for (let k = 0; k <= r && k < h; k++) { const row = k * w; for (let x = 0; x < w; x++) cnt[x] += tmp[row + x]; }
  for (let y = 0; y < h; y++) {
    const row = y * w;
    for (let x = 0; x < w; x++) out[row + x] = cnt[x] > 0 ? 1 : 0;
    if (y + r + 1 < h) { const ra = (y + r + 1) * w; for (let x = 0; x < w; x++) cnt[x] += tmp[ra + x]; }
    if (y - r >= 0) { const rr = (y - r) * w; for (let x = 0; x < w; x++) cnt[x] -= tmp[rr + x]; }
  }
  return out;
}
// k×k の開処理（差分マスクは疎なので 1 の画素だけ見る）
function openK(m, w, h, k) {
  if (k <= 1) return m;
  const e = new Uint8Array(w * h), out = new Uint8Array(w * h);
  for (let i = 0; i < m.length; i++) {
    if (!m[i]) continue;
    const x = i % w, y = (i - x) / w;
    if (x + k > w || y + k > h) continue;
    let all = 1;
    for (let dy = 0; dy < k && all; dy++) { const r = i + dy * w; for (let dx = 0; dx < k; dx++) if (!m[r + dx]) { all = 0; break; } }
    e[i] = all;
  }
  for (let i = 0; i < e.length; i++) {
    if (!e[i]) continue;

  // ページを倍率 s で描き、(ox, oy) を左上とする w×h を返す。T（同じ倍率の画素単位）で新版を旧版の座標に移す
  async function renderRect(doc, pageNo, s, ox, oy, w, h, T) {
    const page = await doc.getPage(pageNo);
    const vp = page.getViewport({ scale: s });
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    let tr = [1, 0, 0, 1, -ox, -oy];
    if (T && !T.identity) {
      const c = Math.cos(T.th), sn = Math.sin(T.th), a = T.sc * c, b = T.sc * sn;
      tr = [a, b, -b, a, -T.sc * (c * T.cx - sn * T.cy) + T.cx + T.tx - ox, -T.sc * (sn * T.cx + c * T.cy) + T.cy + T.ty - oy];
    }
    await page.render({ canvasContext: ctx, viewport: vp, transform: tr, background: '#ffffff' }).promise;
    return { cv, ctx };
  }
  // 最も暗いチャンネルを濃さとする（黄・水色などの色線も拾う）
  function grayOf(ctx, w, h, keepRGBA) {
    const gray = new Uint8Array(w * h), BAND = 512;
    const rgba = keepRGBA ? new Uint8ClampedArray(w * h * 4) : null;
    for (let y0 = 0; y0 < h; y0 += BAND) {
      const bh = Math.min(BAND, h - y0), d = ctx.getImageData(0, y0, w, bh).data, off = y0 * w;
      if (rgba) rgba.set(d, off * 4);
      for (let i = 0, j = 0; i < w * bh; i++, j += 4) {
        const r = d[j], g = d[j + 1], b = d[j + 2];

  }
  const scaleT = (T, r) => ({ ...T, tx: T.tx * r, ty: T.ty * r, cx: T.cx * r, cy: T.cy * r });

  // ---------- 文字での位置合わせ・比較 ----------
  const cen = (r) => [(r.x0 + r.x1) / 2, (r.y0 + r.y1) / 2];
  function textAlign(old, neu, cx, cy) {
    const uniq = (items) => {
      const m = new Map();
      for (const it of items) if (it.text.length >= 2) m.set(it.text, m.has(it.text) ? null : it);
      return m;
    };
    const uo = uniq(old), un = uniq(neu), src = [], dst = [];
    for (const [t, it] of un) { const o = uo.get(t); if (it && o) { src.push(cen(it)); dst.push(cen(o)); } }
    const n = src.length; if (n < 12) return null;
    // 相似変換 z' = a·z + b（複素数）を RANSAC で求める
    const fit = (ids) => {
      let sx = 0, sy = 0, dx = 0, dy = 0;
      for (const i of ids) { sx += src[i][0]; sy += src[i][1]; dx += dst[i][0]; dy += dst[i][1]; }
      sx /= ids.length; sy /= ids.length; dx /= ids.length; dy /= ids.length;
      let nr = 0, ni = 0, den = 0;
      for (const i of ids) {
        const px = src[i][0] - sx, py = src[i][1] - sy, qx = dst[i][0] - dx, qy = dst[i][1] - dy;
        nr += qx * px + qy * py; ni += qy * px - qx * py; den += px * px + py * py;
      }
      if (!den) return null;
      const ar = nr / den, ai = ni / den;
      return { ar, ai, br: dx - (ar * sx - ai * sy), bi: dy - (ai * sx + ar * sy) };
    };
    const inliers = (m) => { const r = []; for (let i = 0; i < n; i++) {
      const x = m.ar * src[i][0] - m.ai * src[i][1] + m.br, y = m.ai * src[i][0] + m.ar * src[i][1] + m.bi;
      if (Math.hypot(x - dst[i][0], y - dst[i][1]) < 1.0) r.push(i); } return r; };
    let seed = 12345; const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    let best = [];
    for (let it = 0; it < 600; it++) {
      const i = Math.floor(rnd() * n), j = Math.floor(rnd() * n); if (i === j) continue;
      const m = fit([i, j]); if (!m) continue;
      const inl = inliers(m); if (inl.length > best.length) best = inl;
    }
    if (best.length < Math.max(10, 0.3 * n)) return null;
    const m = fit(best);
    const sc = Math.hypot(m.ar, m.ai), th = Math.atan2(m.ai, m.ar);
    // p_old = a·p_new + b = sc·R·(p_new − c) + c + t  →  t = a·c + b − c
    const tx = m.ar * cx - m.ai * cy + m.br - cx, ty = m.ai * cx + m.ar * cy + m.bi - cy;
    return { identity: false, th, sc, tx, ty, cx, cy };
  }
  function textDiff(old, neu, T) {
    if (!T.identity) {
      const c = Math.cos(T.th), s = Math.sin(T.th);
      const mv = (x, y) => { x -= T.cx; y -= T.cy; return [T.sc * (c * x - s * y) + T.cx + T.tx, T.sc * (s * x + c * y) + T.cy + T.ty]; };
      neu = neu.map((n) => { const [a, b] = mv(n.x0, n.y0), [p, q] = mv(n.x1, n.y1);
        return { text: n.text, x0: Math.min(a, p), y0: Math.min(b, q), x1: Math.max(a, p), y1: Math.max(b, q) }; });
    }
    const G = 4, cell = (r) => { const [x, y] = cen(r); return [Math.floor(x / G), Math.floor(y / G)]; };
    const grid = new Map();
    old.forEach((o, i) => { const [a, b] = cell(o); const k = `${o.text}\u0000${a},${b}`; (grid.get(k) || grid.set(k, []).get(k)).push(i); });
    const used = new Uint8Array(old.length), added = [];
    for (const nI of neu) {
      const tol = Math.max(0.75, 0.5 * Math.min(nI.x1 - nI.x0, nI.y1 - nI.y0));
      const [nx, ny] = cen(nI), [a, b] = cell(nI);
      let best = -1, bd = tol;
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        for (const i of grid.get(`${nI.text}\u0000${a + dx},${b + dy}`) || []) {
          if (used[i]) continue;
          const [ox, oy] = cen(old[i]), d = Math.hypot(ox - nx, oy - ny);
          if (d <= bd) { best = i; bd = d; }
        }
      }
      if (best >= 0) used[best] = 1; else added.push(nI);
    }
    const removed = old.filter((_, i) => !used[i]);
    const agrid = new Map();
    added.forEach((a, j) => { const k = cell(a).join(','); (agrid.get(k) || agrid.set(k, []).get(k)).push(j); });
    const taken = new Uint8Array(added.length), out = [];
    for (const r of removed) {
      const reach = Math.max(2, 1.5 * Math.min(r.x1 - r.x0, r.y1 - r.y0)), span = Math.floor(reach / G) + 2;
      const [rx, ry] = cell(r);
      let best = -1, bd = Infinity;
      for (let dx = -span; dx <= span; dx++) for (let dy = -span; dy <= span; dy++) {
        for (const j of agrid.get(`${rx + dx},${ry + dy}`) || []) {
          const a = added[j];
          if (taken[j] || a.x1 < r.x0 - reach || a.x0 > r.x1 + reach || a.y1 < r.y0 - reach || a.y0 > r.y1 + reach) continue;
          const d = Math.abs(a.x0 - r.x0) + Math.abs(a.y0 - r.y0);
          if (d < bd) { best = j; bd = d; }
        }
      }
      if (best >= 0) {
        taken[best] = 1; const a = added[best];
        out.push({ x0: Math.min(r.x0, a.x0), y0: Math.min(r.y0, a.y0), x1: Math.max(r.x1, a.x1), y1: Math.max(r.y1, a.y1), bits: 3,
          desc: a.text === r.text ? `位置変更「${r.text}」` : `「${r.text}」→「${a.text}」` });
      } else out.push({ ...r, bits: 1, desc: `文字削除「${r.text}」` });
    }
    added.forEach((a, j) => { if (!taken[j]) out.push({ ...a, bits: 2, desc: `文字追加「${a.text}」` }); });
    return out;
  }
  function mergeText(regions, changes, D, pad, W, H) {
    const s = D / 72;
    for (const ch of changes) {
      const x0 = Math.max(0, Math.floor(ch.x0 * s) - pad), y0 = Math.max(0, Math.floor(ch.y0 * s) - pad);
      const x1 = Math.min(W, Math.ceil(ch.x1 * s) + pad), y1 = Math.min(H, Math.ceil(ch.y1 * s) + pad);
      let hit = regions.find((g) => g.x < x1 && x0 < g.x + g.w && g.y < y1 && y0 < g.y + g.h);
      if (!hit) { hit = { x: x0, y: y0, w: x1 - x0, h: y1 - y0, removed: 0, added: 0, notes: [] }; regions.push(hit); }
      else {
        const nx0 = Math.min(hit.x, x0), ny0 = Math.min(hit.y, y0);
        hit.w = Math.max(hit.x + hit.w, x1) - nx0; hit.h = Math.max(hit.y + hit.h, y1) - ny0; hit.x = nx0; hit.y = ny0;
      }
      if (ch.bits & 1) hit.removed++;
      if (ch.bits & 2) hit.added++;
      if (!hit.notes.includes(ch.desc)) hit.notes.push(ch.desc);
    }
    return regions;
  }

  // ---------- 実行 ----------
  async function run(pageNo) {
    if (state.busy || !state.old || !state.neu) return;
    state.busy = true; state.cancel = false; $('run').disabled = true; setNavDisabled(true);
    hideNotices(); closeDetail();
    setProgress('図面を調べています…', 1);
    const t0 = performance.now();
    try {
      if (!state.info || state.infoPage !== pageNo) {
        const [io, inew] = await Promise.all([inspect(state.old, pageNo), inspect(state.neu, pageNo)]);
        state.info = io; state.infoNew = inew; state.infoPage = pageNo; updateKindInfo();
      }
      const io = state.info, inew = state.infoNew;
      const kind = effKind();
      let dpi = +$('dpi').value || autoDpi(kind, io.items.length);
      const area = io.wPt * io.hPt;
      if (area * (dpi / 72) ** 2 > MAX_ANALYSIS_PX) {
        const d2 = Math.floor(72 * Math.sqrt(MAX_ANALYSIS_PX / area));
        showWarn(`図面が大きいため、解像度を ${dpi} → ${d2} dpi に下げて処理しています。`); dpi = d2;
      }
      const S = dpi / 72, W = Math.ceil(io.wPt * S), H = Math.ceil(io.hPt * S);
      const k = Math.max(1, Math.ceil(Math.sqrt(W * H / MAX_DISPLAY_PX))), D = dpi / k;
      const blur = kind === 'scan';

      // --- しきい値と位置合わせ（低解像度の全体画像で） ---
      setProgress('位置合わせ中…', 3);
      const A = Math.min(S, Math.sqrt(MAX_ALIGN_PX / area), 16000 / Math.max(io.wPt, io.hPt, inew.wPt, inew.hPt));
      const aw = Math.ceil(io.wPt * A), ah = Math.ceil(io.hPt * A), anw = Math.ceil(inew.wPt * A), anh = Math.ceil(inew.hPt * A);
      const useText = $('textcmp').value === '1' && kind === 'cad' && io.items.length && inew.items.length;
      let Tt = null, how = '';
      if ($('align').value === '1' && useText) Tt = textAlign(io.items, inew.items, io.wPt / 2, io.hPt / 2);
      const needEstimate = $('align').value === '1' && !Tt;
      const [ra, rb] = await Promise.all([renderRect(state.old, pageNo, A, 0, 0, aw, ah), renderRect(state.neu, pageNo, A, 0, 0, anw, anh)]);
      const ga = grayOf(ra.ctx, aw, ah).gray, gb = grayOf(rb.ctx, anw, anh).gray;
      ra.cv.width = rb.cv.width = 0;
      const prep = await call({ cmd: 'prepare', oldG: ga, w: aw, h: ah, newG: gb, nw: anw, nh: anh, cx: aw / 2, cy: ah / 2,
        p: { kind, blur, threshold: +$('threshold').value || 0, estimate: needEstimate } }, [ga.buffer, gb.buffer]);
      let T;
      if (Tt) {
        how = '（文字の位置から）';
        T = scaleT(Tt, S);
        const long = Math.max(W, H);
        if (Math.max(Math.abs(T.tx), Math.abs(T.ty)) < 0.5 && Math.max(Math.abs(T.th), Math.abs(T.sc - 1)) * long / 2 < 0.5) T = { identity: true };
      } else if (prep.T) T = prep.T.identity ? { identity: true } : scaleT(prep.T, S / A);
      else T = { identity: true };
      if (T.identity) T = { identity: true, th: 0, sc: 1, tx: 0, ty: 0, cx: W / 2, cy: H / 2 };

      const r300 = dpi / 300;
      let dp;
      if (kind === 'cad') {
        const tol = T.identity ? 1 : Math.max(1, Math.round(0.1 / MM * dpi));
        dp = { blur: false, thrOld: prep.thrOld, thrNew: prep.thrNew, tol, openK: 0, minArea: T.identity ? 4 : Math.max(4, tol * tol), emph: 1 };
      } else {
        dp = { blur: true, thrOld: prep.thrOld, thrNew: prep.thrNew, tol: Math.round(+$('tolerance').value * r300),
          openK: Math.round(+$('openK').value * r300), minArea: Math.round(+$('minArea').value * r300 * r300), emph: 1 };
      }

      // --- タイル処理 ---
      const TH = Math.min(H, Math.max(k, Math.floor(4096 / k) * k));
      const TW = Math.min(W, Math.max(k, Math.floor(Math.min(TILE_PX / (TH + 2 * MARGIN) - 2 * MARGIN, 12000) / k) * k));
      const dw = Math.ceil(W / k), dh = Math.ceil(H / k), flags = new Uint8Array(dw * dh);
      const tiles = []; for (let y = 0; y < H; y += TH) for (let x = 0; x < W; x += TW) tiles.push([x, y]);
      let prev = null;
      const merge = (res, X0, Y0) => {

        const el = (performance.now() - t0) / 1000, eta = ti ? el / ti * (tiles.length - ti) : 0;
        setProgress(`比較中… ${ti + 1} / ${tiles.length} 区画${ti ? `（残り 約 ${Math.ceil(eta)} 秒）` : ''}`, 6 + 86 * ti / tiles.length);
        const [ro, rn] = await Promise.all([renderRect(state.old, pageNo, S, ox, oy, tw, th), renderRect(state.neu, pageNo, S, ox, oy, tw, th, T)]);
        const og = grayOf(ro.ctx, tw, th).gray, ng = grayOf(rn.ctx, tw, th).gray;
        ro.cv.width = rn.cv.width = 0;
        if (prev) { const r = await prev.p; merge(r, prev.X0, prev.Y0); }
        prev = { X0, Y0, p: call({ cmd: 'tile', oldG: og, newG: ng, w: tw, h: th, core: { x: MARGIN, y: MARGIN, w: cw, h: ch }, k, p: dp }, [og.buffer, ng.buffer]) };
      }
      if (prev) { const r = await prev.p; merge(r, prev.X0, prev.Y0); }

      setProgress('変更箇所をまとめています…', 94);
      const pad = Math.max(2, Math.round(15 * D / 300));
      const fin = await call({ cmd: 'finish', flags, w: dw, h: dh, p: { cluster: Math.max(4, Math.round(+$('cluster').value * D / 300)), pad, emph: Math.max(1, Math.round(D / 300)) } }, [flags.buffer]);
      let regions = fin.regions;
      let textInfo = null;
      if (useText) {

        regions = mergeText(regions, changes, D, pad, dw, dh);

      const band = Math.max(1, Math.floor(dh / 40));
      regions.sort((a, b) => (Math.floor(a.y / band) - Math.floor(b.y / band)) || (a.x - b.x));

      showResult({ page: pageNo, dpi, D, k, S, W, H, dw, dh, rgba: fin.rgba, regions, T, how, kind, dp, textInfo,
        ms: performance.now() - t0, ntiles: tiles.length });
    } catch (e) {
      if (String(e && e.message) === 'CANCEL') { showWarn('中止しました。'); }
      else {

        const msg = String(e && e.message || e);

          ? 'メモリが足りませんでした。解像度を下げて（300dpi など）もう一度お試しください。'

  }
  $('cancel').onclick = () => { state.cancel = true; $('progMsg').textContent = '中止しています…'; };

  // ---------- 結果表示 ----------
  const vpEl = $('viewport'), stage = $('stage');
  function showResult(r) {
    state.result = r;
    // 全体図は CANVAS_SIDE 四方のキャンバスに分けて持つ（ブラウザのキャンバス寸法の上限を避ける）
    for (const c of stage.querySelectorAll('canvas')) c.remove();
    const img = new ImageData(new Uint8ClampedArray(r.rgba), r.dw, r.dh);
    r.rgba = null;
    r.canvases = [];
    for (let y = 0; y < r.dh; y += CANVAS_SIDE) for (let x = 0; x < r.dw; x += CANVAS_SIDE) {
      const cw = Math.min(CANVAS_SIDE, r.dw - x), ch = Math.min(CANVAS_SIDE, r.dh - y);
      const c = document.createElement('canvas'); c.width = cw; c.height = ch;
      c.getContext('2d').putImageData(img, -x, -y, x, y, cw, ch);
      c.dataset.x = x; c.dataset.y = y;
      stage.insertBefore(c, $('overlay'));
      r.canvases.push(c);
    }
    const nR = r.regions.filter((g) => g.removed && !g.added).length;
    const nA = r.regions.filter((g) => g.added && !g.removed).length;
    const nC = r.regions.length - nR - nA;
    const nT = r.regions.filter((g) => g.notes.length).length;
    const T = r.T, alignTxt = T.identity ? `ズレなし${r.how}` : `ズレ補正${r.how} ${(T.tx / r.dpi * MM).toFixed(2)}, ${(T.ty / r.dpi * MM).toFixed(2)} mm`;
    $('summary').innerHTML = `
      <div class="stat"><b>${r.regions.length}</b><span>変更箇所（${r.page}/${state.pageCount} ページ）</span></div>
      <div class="stat"><b style="color:var(--removed)">${nR}</b><span>削除</span></div>
      <div class="stat"><b style="color:var(--added)">${nA}</b><span>追加</span></div>
      <div class="stat"><b style="color:var(--changed)">${nC}</b><span>変更（削除＋追加）</span></div>
      ${r.textInfo ? `<div class="stat"><b style="color:var(--note)">${nT}</b><span>文字の変更を含む</span></div>` : ''}
      <div class="stat"><b style="font-size:14px;line-height:1.9">${alignTxt}</b><span>${r.kind === 'cad' ? 'CAD' : 'スキャン'}・${r.dpi} dpi・${(r.ms / 1000).toFixed(1)} 秒</span></div>`;
    if (r.regions.length > 300)
      showWarn('変更箇所がとても多く検出されました。位置合わせがうまくいっていない可能性があります。図面の種類や「ズレの許容幅」を見直してください。');
    renderList(r);
    $('overlay').innerHTML = r.regions.map((g, i) =>
      `<div class="ob" data-i="${i}" style="left:${g.x / r.dw * 100}%;top:${g.y / r.dh * 100}%;width:${g.w / r.dw * 100}%;height:${g.h / r.dh * 100}%"><span>${i + 1}</span></div>`).join('');
    $('result').classList.add('on');
    $('prevPage').disabled = r.page <= 1;
    $('nextPage').disabled = r.page >= state.pageCount;
    $('page').value = r.page;
    const fitH = r.dh * (vpEl.clientWidth / r.dw) + 4;
    vpEl.style.height = `${Math.round(Math.max(140, Math.min(window.innerHeight * 0.7, fitH)))}px`;
    $('zoomH').hidden = r.dw / r.dh < 4;   // 超長尺の図面だけ「高さに合わせる」を出す
    requestAnimationFrame(() => { zoomFit(); $('result').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  }
  const kindOf = (g) => g.removed && g.added ? ['changed', '変更'] : g.removed ? ['removed', '削除'] : ['added', '追加'];
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function renderList(r) {
    const el = $('list');
    if (!r.regions.length) { el.innerHTML = '<div class="empty">差分は見つかりませんでした。</div>'; return; }
    const mm = (v) => (v * MM / r.D).toFixed(0);
    el.innerHTML = `<table><thead><tr><th>No</th><th>種別</th><th>位置 (x, y)</th><th>大きさ</th></tr></thead><tbody>${
      r.regions.map((g, i) => {
        const [c, t] = kindOf(g);
        const note = g.notes.length ? `<tr data-i="${i}" class="noterow"><td></td><td colspan="3" class="note">${esc(g.notes.slice(0, 6).join(' / '))}${g.notes.length > 6 ? ` ほか ${g.notes.length - 6} 件` : ''}</td></tr>` : '';
        return `<tr data-i="${i}"><td class="num">${i + 1}</td><td><span class="chip ${c}">${t}</span></td><td class="num">${mm(g.x)}, ${mm(g.y)}</td><td class="num">${(g.w * MM / r.D).toFixed(1)}×${(g.h * MM / r.D).toFixed(1)}</td></tr>${note}`;
      }).join('')}</tbody></table>`;
  }
  $('list').addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-i]'); if (!tr) return;
    openDetail(+tr.dataset.i);
  });

  // ---------- ズーム・移動 ----------
  function layoutStage() {
    const r = state.result, z = state.zoom;
    stage.style.width = `${Math.round(r.dw * z)}px`; stage.style.height = `${Math.round(r.dh * z)}px`;
    for (const c of r.canvases) {
      c.style.left = `${c.dataset.x * z}px`; c.style.top = `${c.dataset.y * z}px`;
      c.style.width = `${c.width * z}px`; c.style.height = `${c.height * z}px`;
    }
  }
  function setZoom(z, cx, cy) {
    const r = state.result; if (!r) return;
    const minZ = Math.min(1, vpEl.clientWidth / r.dw, vpEl.clientHeight / r.dh);
    z = Math.max(minZ * 0.5, Math.min(8, z));
    if (cx === undefined) { cx = vpEl.clientWidth / 2; cy = vpEl.clientHeight / 2; }
    const ix = (vpEl.scrollLeft + cx) / state.zoom, iy = (vpEl.scrollTop + cy) / state.zoom;
    state.zoom = z; layoutStage();
    vpEl.scrollLeft = ix * z - cx; vpEl.scrollTop = iy * z - cy;
    $('zoomVal').textContent = `${z < 0.1 ? (z * 100).toFixed(1) : Math.round(z * 100)}%`;
  }
  function zoomFit() {
    const r = state.result; if (!r) return;
    state.zoom = 1;
    setZoom(Math.min(vpEl.clientWidth / r.dw, vpEl.clientHeight / r.dh) * 0.99);
    vpEl.scrollLeft = 0; vpEl.scrollTop = 0;
  }
  function focusRegion(g) {
    const z = Math.min(4, Math.max(0.05, Math.min(vpEl.clientWidth / (g.w * 4), vpEl.clientHeight / (g.h * 4))));
    setZoom(z);
    vpEl.scrollLeft = (g.x + g.w / 2) * z - vpEl.clientWidth / 2;
    vpEl.scrollTop = (g.y + g.h / 2) * z - vpEl.clientHeight / 2;
  }
  $('zoomFit').onclick = zoomFit;
  $('zoomH').onclick = () => {
    const r = state.result; if (!r) return;
    vpEl.style.height = `${Math.round(window.innerHeight * 0.6)}px`;
    setZoom((vpEl.clientHeight - 16) / r.dh, 0, 0);
  };
  $('zoomIn').onclick = () => setZoom(state.zoom * 1.5);
  $('zoomOut').onclick = () => setZoom(state.zoom / 1.5);
  vpEl.addEventListener('wheel', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const rect = vpEl.getBoundingClientRect();
    setZoom(state.zoom * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX - rect.left, e.clientY - rect.top);
  }, { passive: false });
  let drag = null;
  vpEl.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, sl: vpEl.scrollLeft, st: vpEl.scrollTop }; vpEl.classList.add('drag'); vpEl.setPointerCapture(e.pointerId); });
  vpEl.addEventListener('pointermove', (e) => { if (!drag) return; vpEl.scrollLeft = drag.sl - (e.clientX - drag.x); vpEl.scrollTop = drag.st - (e.clientY - drag.y); });
  const endDrag = () => { drag = null; vpEl.classList.remove('drag'); };
  vpEl.addEventListener('pointerup', endDrag); vpEl.addEventListener('pointercancel', endDrag);

  // ---------- 拡大図（変更箇所を高解像度で描き直す） ----------
  let detailSeq = 0;
  async function openDetail(i) {
    const r = state.result, g = r.regions[i]; if (!g) return;
    state.detailIdx = i;
    for (const x of $('list').querySelectorAll('tr.sel')) x.classList.remove('sel');
    for (const x of $('list').querySelectorAll(`tr[data-i="${i}"]`)) x.classList.add('sel');
    for (const x of $('overlay').querySelectorAll('.ob')) x.classList.toggle('sel', +x.dataset.i === i);
    focusRegion(g);
    const [, kt] = kindOf(g), mm = (v) => (v * MM / r.D).toFixed(1);
    $('dTitle').textContent = `変更箇所 ${i + 1}　${kt}　位置 ${mm(g.x)}, ${mm(g.y)} mm　大きさ ${mm(g.w)}×${mm(g.h)} mm`;
    $('dNote').textContent = g.notes.length ? `文字: ${g.notes.join(' / ')}` : '';
    $('detail').classList.add('on');
    $('dPrev').disabled = i <= 0; $('dNext').disabled = i >= r.regions.length - 1;
    const dc = $('dCanvas'); dc.width = 1; dc.height = 1;
    $('dView').dataset.busy = '1';
    const seq = ++detailSeq;
    const busy = document.createElement('div'); busy.className = 'dbusy'; busy.textContent = '高解像度で描き直しています…';
    $('dView').prepend(busy);
    try {
      // 解析解像度の画素に戻して余白を付け、長辺 2000px・最大 2400dpi・800万画素に収まる倍率で描く
      const x0 = g.x * r.k, y0 = g.y * r.k, x1 = (g.x + g.w) * r.k, y1 = (g.y + g.h) * r.k;
      const pad = Math.max(0.6 * Math.max(x1 - x0, y1 - y0), 3 / MM * r.dpi);
      const cx0 = Math.max(0, Math.floor(x0 - pad)), cy0 = Math.max(0, Math.floor(y0 - pad));
      const cx1 = Math.min(r.W, Math.ceil(x1 + pad)), cy1 = Math.min(r.H, Math.ceil(y1 + pad));
      const rr = Math.min(2400 / r.dpi, 2000 / Math.max(cx1 - cx0, cy1 - cy0), Math.sqrt(8e6 / ((cx1 - cx0) * (cy1 - cy0))));
      const Sd = r.S * rr, ox = cx0 * rr, oy = cy0 * rr;
      const w = Math.max(1, Math.round((cx1 - cx0) * rr)), h = Math.max(1, Math.round((cy1 - cy0) * rr));
      const [ro, rn] = await Promise.all([renderRect(state.old, r.page, Sd, ox, oy, w, h),
        renderRect(state.neu, r.page, Sd, ox, oy, w, h, r.T.identity ? null : scaleT(r.T, rr))]);
      const a = grayOf(ro.ctx, w, h, true), b = grayOf(rn.ctx, w, h, true);
      ro.cv.width = rn.cv.width = 0;
      let dp;
      if (r.kind === 'cad') {
        const tol = r.T.identity ? 1 : Math.max(1, Math.round(0.1 / MM * Sd * 72));
        dp = { ...r.dp, tol, minArea: r.T.identity ? 4 : Math.max(4, tol * tol), emph: 1, gray: 160 };
      } else {
        dp = { ...r.dp, tol: Math.max(r.dp.tol ? 1 : 0, Math.round(r.dp.tol * rr)), openK: Math.round(r.dp.openK * rr),
          minArea: Math.max(1, Math.round(r.dp.minArea * rr * rr)), emph: 1, gray: 160 };
      }
      const res = await call({ cmd: 'tile', oldG: a.gray, newG: b.gray, w, h, core: { x: 0, y: 0, w, h }, k: 1, p: dp, wantRGBA: true }, [a.gray.buffer, b.gray.buffer]);
      if (seq !== detailSeq) return;
      const box = [x0 * rr - ox, y0 * rr - oy, (x1 - x0) * rr, (y1 - y0) * rr];
      state.dimgs = { w, h, box, diff: new ImageData(new Uint8ClampedArray(res.rgba), w, h), old: new ImageData(a.rgba, w, h), new: new ImageData(b.rgba, w, h) };
      drawDetail();
    } catch (e) {
      if (seq === detailSeq) $('dNote').textContent = `拡大図を作れませんでした: ${e.message || e}`;
    } finally { busy.remove(); }
    if (seq === detailSeq) $('detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function drawDetail() {
    const d = state.dimgs; if (!d) return;
    const c = $('dCanvas'); c.width = d.w; c.height = d.h;
    const ctx = c.getContext('2d');
    ctx.putImageData(d[state.dmode], 0, 0);
    ctx.strokeStyle = '#ff9600'; ctx.lineWidth = Math.max(2, d.w / 500);
    ctx.strokeRect(...d.box);
    c.style.width = state.dzoom ? `${d.w}px` : '100%';
    c.style.maxWidth = state.dzoom ? 'none' : `${d.w * 2}px`;
    $('dZoom').textContent = state.dzoom ? '幅に合わせる' : '原寸';
    // 変更箇所が表示枠の中央に来るようにスクロール
    const v = $('dView'), z = c.clientWidth / d.w;
    v.scrollLeft = (d.box[0] + d.box[2] / 2) * z - v.clientWidth / 2;
    v.scrollTop = (d.box[1] + d.box[3] / 2) * z - v.clientHeight / 2;
  }
  function closeDetail() { $('detail').classList.remove('on'); state.dimgs = null; state.detailIdx = -1; }
  for (const b of document.querySelectorAll('[data-dmode]')) b.onclick = () => {
    state.dmode = b.dataset.dmode;
    for (const x of document.querySelectorAll('[data-dmode]')) x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
    drawDetail();
  };
  $('dZoom').onclick = () => { state.dzoom = !state.dzoom; drawDetail(); };
  $('dPrev').onclick = () => openDetail(state.detailIdx - 1);
  $('dNext').onclick = () => openDetail(state.detailIdx + 1);

  // ---------- 保存 ----------
  const baseName = () => `差分_${state.oldName.replace(/\.pdf$/i, '')}_vs_${state.newName.replace(/\.pdf$/i, '')}_p${state.result.page}`;
  function download(blob, name) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }
  $('dlPng').onclick = () => {
    const r = state.result;
    // 1 枚の画像にまとめる（ブラウザの上限を超える場合は縮小）
    const s = Math.min(1, 32000 / r.dw, 32000 / r.dh, Math.sqrt(200e6 / (r.dw * r.dh)));
    const c = document.createElement('canvas'); c.width = Math.round(r.dw * s); c.height = Math.round(r.dh * s);
    const ctx = c.getContext('2d');
    for (const t of r.canvases) ctx.drawImage(t, t.dataset.x * s, t.dataset.y * s, t.width * s, t.height * s);
    const lw = Math.max(2, Math.round(r.D / 100 * s)), fs = Math.max(12, Math.round(r.D / 300 * 30 * s));
    ctx.font = `bold ${fs}px system-ui, sans-serif`;
    r.regions.forEach((g, i) => {
      ctx.strokeStyle = '#ff9600'; ctx.lineWidth = lw; ctx.strokeRect(g.x * s, g.y * s, g.w * s, g.h * s);
      const label = String(i + 1), tw = ctx.measureText(label).width, ly = g.y * s - fs - 6 > 0 ? g.y * s - fs - 6 : (g.y + g.h) * s;
      ctx.fillStyle = '#ff9600'; ctx.fillRect(g.x * s, ly, tw + 10, fs + 6);
      ctx.fillStyle = '#fff'; ctx.fillText(label, g.x * s + 5, ly + fs);
    });
    const b = $('dlPng'); b.disabled = true; b.textContent = '保存中…';
    c.toBlob((blob) => {
      b.disabled = false; b.textContent = '全体図を保存 (PNG)'; c.width = 0;
      if (blob) download(blob, `${baseName()}.png`); else showErr('画像を保存できませんでした（大きすぎる可能性があります）。');
    }, 'image/png');
  };
  $('dlCsv').onclick = () => {
    const r = state.result, mm = (v) => (v * MM / r.D).toFixed(1);
    const q = (s) => `"${String(s).replace(/"/g, '""')}"`;
    const rows = [['ページ', 'No', '種別', 'x_mm', 'y_mm', '幅_mm', '高さ_mm', '文字の変更']];
    r.regions.forEach((g, i) => rows.push([r.page, i + 1, kindOf(g)[1], mm(g.x), mm(g.y), mm(g.w), mm(g.h), q(g.notes.join(' / '))]));
    download(new Blob(['﻿' + rows.map((x) => x.join(',')).join('\r\n')], { type: 'text/csv' }), `${baseName()}.csv`);
  };

  // ---------- ページ移動 ----------
  function setNavDisabled(d) {
    const r = state.result;
    $('prevPage').disabled = d || !r || r.page <= 1;
    $('nextPage').disabled = d || !r || r.page >= state.pageCount;
  }
  $('prevPage').onclick = () => run(state.result.page - 1);
  $('nextPage').onclick = () => run(state.result.page + 1);
  $('run').onclick = () => run(+$('page').value || 1);

  // ---------- 表示ヘルパー ----------
  function setProgress(msg, pct) { $('progress').classList.add('on'); $('progMsg').textContent = msg; $('barFill').style.width = `${pct}%`; }
  function showWarn(m) { const e = $('warn'); e.textContent = m; e.classList.add('on'); }
  function showErr(m) { const e = $('err'); e.textContent = m; e.classList.add('on'); }
  function hideNotices() { $('warn').classList.remove('on'); $('err').classList.remove('on'); }

  setupDrop('dropOld', 'fileOld', 'nameOld', 'old');
  setupDrop('dropNew', 'fileNew', 'nameNew', 'neu');
})();
</script>
</body>
</html>
