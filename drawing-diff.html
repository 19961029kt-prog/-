<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>図面差分チェッカー</title>
<meta name="description" content="旧版と新版の図面PDFを重ねて、削除=赤・追加=青で変更点をハイライトします。処理はすべてブラウザ内で行い、ファイルは送信されません。">
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f3;
  --border: #d9dde3;
  --text: #1c2128;
  --muted: #5f6873;
  --accent: #1f6feb;
  --accent-text: #ffffff;
  --removed: #e60000;
  --added: #005ae6;
  --box: #ff9600;
  --warn-bg: #fff6e0;
  --warn-text: #7a5300;
  --err-bg: #fde8e8;
  --err-text: #9b1c1c;
  --viewer-bg: #e3e6ea;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b;
    --surface: #1d2126;
    --surface-2: #262b31;
    --border: #353b43;
    --text: #e6e9ed;
    --muted: #9aa3ad;
    --accent: #4c8dff;
    --accent-text: #0b1220;
    --warn-bg: #3a2f12;
    --warn-text: #f3d48a;
    --err-bg: #3d1a1a;
    --err-text: #f5b4b4;
    --viewer-bg: #0f1215;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b;
  --surface: #1d2126;
  --surface-2: #262b31;
  --border: #353b43;
  --text: #e6e9ed;
  --muted: #9aa3ad;
  --accent: #4c8dff;
  --accent-text: #0b1220;
  --warn-bg: #3a2f12;
  --warn-text: #f3d48a;
  --err-bg: #3d1a1a;
  --err-text: #f5b4b4;
  --viewer-bg: #0f1215;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
  font-size: 15px;
  line-height: 1.6;
}
main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: .02em; }
.lead { color: var(--muted); margin: 0 0 20px; }
.privacy {
  display: inline-flex; gap: 6px; align-items: center;
  font-size: 13px; color: var(--muted);
  background: var(--surface-2); border-radius: 999px; padding: 3px 12px; margin-bottom: 20px;
}
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; margin-bottom: 16px;
}
.step-title { font-size: 15px; font-weight: 700; margin: 0 0 12px; }
.files { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .files { grid-template-columns: 1fr; } }
.drop {
  border: 2px dashed var(--border); border-radius: 10px; padding: 18px;
  text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  min-height: 112px; display: flex; flex-direction: column; justify-content: center; gap: 4px;
}
.drop:hover, .drop.over { border-color: var(--accent); background: var(--surface-2); }
.drop.ready { border-style: solid; }
.drop .tag { font-weight: 700; font-size: 16px; }
.drop.old .tag { color: var(--removed); }
.drop.new .tag { color: var(--added); }
.drop .name { font-size: 13px; color: var(--muted); word-break: break-all; }
.drop input { display: none; }
.row { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
select, input[type=number] {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; min-width: 120px;
}
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.preset {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 10px; padding: 8px 14px; cursor: pointer; font: inherit; text-align: left;
}
.preset small { display: block; color: var(--muted); font-size: 12px; }
.preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
details { margin-top: 14px; }
summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.adv { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 12px; }
.adv .hint { font-size: 12px; color: var(--muted); }
button.primary {
  font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 10px;
  background: var(--accent); color: var(--accent-text); padding: 12px 28px; cursor: pointer;
}
button.primary:disabled { opacity: .45; cursor: not-allowed; }
button.ghost {
  font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
button.ghost:disabled { opacity: .45; cursor: not-allowed; }
.progress { margin-top: 14px; display: none; }
.progress.on { display: block; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.progress .msg { font-size: 13px; color: var(--muted); margin-top: 6px; }
.notice { border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: 14px; display: none; }
.notice.on { display: block; }
.notice.warn { background: var(--warn-bg); color: var(--warn-text); }
.notice.err { background: var(--err-bg); color: var(--err-text); }
#result { display: none; }
#result.on { display: block; }
.summary { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 14px; min-width: 120px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); align-items: center; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.toolbar .sp { flex: 1; }
.zoomval { font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; font-size: 13px; color: var(--muted); }
.viewport {
  background: var(--viewer-bg); border-radius: 10px; overflow: auto; height: 70vh; min-height: 320px;
  cursor: grab; position: relative; width: 100%;
}
.viewport.drag { cursor: grabbing; }
.viewport canvas { display: block; image-rendering: auto; }
.stage { position: relative; width: max-content; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
.overlay.off { display: none; }
.ob { position: absolute; border: 2px solid var(--box); border-radius: 2px; min-width: 10px; min-height: 10px; }
.ob span {
  position: absolute; left: -2px; bottom: 100%; background: var(--box); color: #fff;
  font-size: 11px; font-weight: 700; line-height: 1; padding: 2px 4px; border-radius: 3px 3px 0 0;
}
.ob.sel { border-width: 3px; box-shadow: 0 0 0 3px rgba(255,150,0,.35); }
.list { max-height: calc(70vh + 44px); overflow: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--surface); }
tbody tr { cursor: pointer; }
tbody tr:hover, tbody tr.sel { background: var(--surface-2); }
.chip { display: inline-block; border-radius: 6px; padding: 0 6px; font-size: 12px; color: #fff; }
.chip.removed { background: var(--removed); }
.chip.added { background: var(--added); }
.chip.changed { background: #7a3db8; }
.num { font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
.howto { font-size: 14px; color: var(--muted); }
.howto li { margin-bottom: 4px; }
</style>
</head>
<body>
<main>
  <h1>図面差分チェッカー</h1>
  <p class="lead">旧版と新版の図面PDFを重ね、<b style="color:var(--removed)">削除＝赤</b>、<b style="color:var(--added)">追加＝青</b>で変更点をハイライトします。スキャン図面（文字情報なし）にも使えます。</p>
  <div class="privacy">🔒 図面はこのPCのブラウザ内だけで処理されます。どこにも送信されません。</div>

  <section class="card">
    <p class="step-title">① 図面PDFを選ぶ</p>
    <div class="files">
      <label class="drop old" id="dropOld">
        <span class="tag">旧版（変更前）</span>
        <span class="name" id="nameOld">クリックして選択、またはここにドロップ</span>
        <input type="file" accept="application/pdf,.pdf" id="fileOld">
      </label>
      <label class="drop new" id="dropNew">
        <span class="tag">新版（変更後）</span>
        <span class="name" id="nameNew">クリックして選択、またはここにドロップ</span>
        <input type="file" accept="application/pdf,.pdf" id="fileNew">
      </label>
    </div>
  </section>

  <section class="card">
    <p class="step-title">② 検出のしかたを選ぶ</p>
    <div class="presets" id="presets">
      <button type="button" class="preset" data-preset="standard" aria-pressed="true">標準<small>まずはこれ</small></button>
      <button type="button" class="preset" data-preset="sensitive" aria-pressed="false">細かく拾う<small>小さな変更を見逃したくない</small></button>
      <button type="button" class="preset" data-preset="robust" aria-pressed="false">ノイズに強く<small>汚れ・ズレが多いスキャン</small></button>
    </div>
    <div class="row" style="margin-top:14px">
      <label class="field">解像度
        <select id="dpi">
          <option value="150">150 dpi（速い）</option>
          <option value="200">200 dpi</option>
          <option value="300" selected>300 dpi（推奨）</option>
          <option value="400">400 dpi（精密・重い）</option>
        </select>
      </label>
      <label class="field">比較するページ
        <select id="page" disabled><option>—</option></select>
      </label>
    </div>
    <details>
      <summary>詳細設定</summary>
      <div class="adv">
        <label class="field">ズレの許容幅 (px)
          <input type="number" id="tolerance" min="0" max="30" value="3">
          <span class="hint">上げる＝線の縁の誤検出が減る</span>
        </label>
        <label class="field">無視する小さな差分 (px²)
          <input type="number" id="minArea" min="0" max="5000" value="30">
          <span class="hint">上げる＝ゴミ点を無視</span>
        </label>
        <label class="field">点ノイズ除去 (px)
          <input type="number" id="openK" min="0" max="5" value="2">
          <span class="hint">0＝しない</span>
        </label>
        <label class="field">線の濃さのしきい値
          <input type="number" id="threshold" min="0" max="254" value="0">
          <span class="hint">0＝自動。薄い線を拾うなら 200 前後</span>
        </label>
        <label class="field">枠にまとめる距離 (px)
          <input type="number" id="cluster" min="1" max="500" value="40">
          <span class="hint">上げる＝近くの変更を1つの枠に</span>
        </label>
        <label class="field">位置合わせ
          <select id="align">
            <option value="1" selected>自動で合わせる</option>
            <option value="0">しない</option>
          </select>
          <span class="hint">数値は 300dpi 基準。dpi に合わせて自動換算</span>
        </label>
      </div>
    </details>
  </section>

  <section class="card">
    <p class="step-title">③ 比較する</p>
    <div class="row">
      <button class="primary" id="run" disabled>比較する</button>
      <span class="howto" id="runHint">旧版と新版の両方を選んでください</span>
    </div>
    <div class="progress" id="progress"><div class="bar"><div id="barFill"></div></div><div class="msg" id="progMsg"></div></div>
    <div class="notice warn" id="warn"></div>
    <div class="notice err" id="err"></div>
  </section>

  <section class="card" id="result">
    <div class="summary" id="summary"></div>
    <div class="legend" style="margin-bottom:12px">
      <span><span class="sw" style="background:var(--removed)"></span>削除（旧版のみ）</span>
      <span><span class="sw" style="background:var(--added)"></span>追加（新版のみ）</span>
      <span><span class="sw" style="background:#c8c8c8"></span>変更なし</span>
      <span><span class="sw" style="background:var(--box)"></span>変更箇所（番号）</span>
    </div>
    <div class="layout">
      <div>
        <div class="toolbar">
          <button class="ghost" id="zoomFit">全体</button>
          <button class="ghost" id="zoomOut" aria-label="縮小">－</button>
          <span class="zoomval" id="zoomVal">100%</span>
          <button class="ghost" id="zoomIn" aria-label="拡大">＋</button>
          <button class="ghost" id="zoom100">原寸</button>
          <span class="sp"></span>
          <button class="ghost" id="prevPage">◀ 前のページ</button>
          <button class="ghost" id="nextPage">次のページ ▶</button>
        </div>
        <div class="viewport" id="viewport"><div class="stage" id="stage"><canvas id="canvas"></canvas><div class="overlay" id="overlay"></div></div></div>
        <div class="row" style="margin-top:10px">
          <button class="ghost" id="dlPng">画像を保存 (PNG)</button>
          <button class="ghost" id="dlCsv">変更箇所一覧を保存 (CSV)</button>
          <span class="howto">ドラッグで移動、Ctrl＋ホイールで拡大縮小</span>
        </div>
      </div>
      <div>
        <p class="step-title" style="margin-bottom:6px">変更箇所一覧</p>
        <div class="howto" style="font-size:12px;margin-bottom:6px">クリックでその場所へ移動。位置は図面左上からの mm</div>
        <div class="list" id="list"></div>
      </div>
    </div>
  </section>
</main>

<script src="vendor/pdfjs-3.11.174/pdf.min.js"></script>

<!-- 画像処理はページを固めないよう Web Worker で実行する -->
<script id="workerSrc" type="text/plain">
'use strict';
const post = (o, t) => self.postMessage(o, t || []);
const prog = (msg, pct) => post({ type: 'progress', msg, pct });

self.onmessage = (e) => {
  try { run(e.data); }
  catch (err) { post({ type: 'error', message: String((err && err.stack) || err) }); }
};

// ---------- 基本処理 ----------
function blur3(src, w, h) {
  // 3x3 の箱型ぼかし（分離型）
  const tmp = new Uint16Array(w * h), out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    const r = y * w;
    for (let x = 0; x < w; x++) {
      const a = src[r + (x > 0 ? x - 1 : 0)], b = src[r + x], c = src[r + (x < w - 1 ? x + 1 : x)];
      tmp[r + x] = a + b + c;
    }
  }
  for (let y = 0; y < h; y++) {
    const up = (y > 0 ? y - 1 : 0) * w, me = y * w, dn = (y < h - 1 ? y + 1 : y) * w;
    for (let x = 0; x < w; x++) out[me + x] = ((tmp[up + x] + tmp[me + x] + tmp[dn + x]) / 9 + 0.5) | 0;
  }
  return out;
}

function otsu(img) {
  const hist = new Float64Array(256);
  for (let i = 0; i < img.length; i++) hist[img[i]]++;
  const total = img.length;
  let sum = 0; for (let t = 0; t < 256; t++) sum += t * hist[t];
  let sumB = 0, wB = 0, best = 0, thr = 127;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue;
    const wF = total - wB; if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if (between > best) { best = between; thr = t; }
  }
  return thr;
}

// 線・記号（暗い画素）=1、背景=0
function inkMask(gray, w, h, p) {
  const g = p.blur ? blur3(gray, w, h) : gray;
  const t = p.threshold > 0 ? p.threshold : otsu(g);
  const m = new Uint8Array(w * h);
  for (let i = 0; i < m.length; i++) m[i] = g[i] <= t ? 1 : 0;
  return m;
}

// 行方向/列方向の窓 [i-a, i+b] 内の 1 の数で判定（any=膨張, all=収縮）
function windowRow(src, w, h, a, b, all) {
  const out = new Uint8Array(w * h), need = a + b + 1;
  for (let y = 0; y < h; y++) {
    const r = y * w;
    // 初期窓: x=0 のとき [-a, b]
    let c = 0; for (let k = 0; k <= b && k < w; k++) c += src[r + k];
    for (let x = 0; x < w; x++) {
      out[r + x] = all ? (c === need ? 1 : 0) : (c > 0 ? 1 : 0);
      const add = x + b + 1, rem = x - a;
      if (add < w) c += src[r + add];
      if (rem >= 0) c -= src[r + rem];
    }
  }
  return out;
}
function windowCol(src, w, h, a, b, all) {
  const out = new Uint8Array(w * h), need = a + b + 1;
  const cnt = new Uint16Array(w);
  for (let k = 0; k <= b && k < h; k++) { const r = k * w; for (let x = 0; x < w; x++) cnt[x] += src[r + x]; }
  for (let y = 0; y < h; y++) {
    const r = y * w;
    if (all) for (let x = 0; x < w; x++) out[r + x] = cnt[x] === need ? 1 : 0;
    else for (let x = 0; x < w; x++) out[r + x] = cnt[x] > 0 ? 1 : 0;
    const add = y + b + 1, rem = y - a;
    if (add < h) { const ra = add * w; for (let x = 0; x < w; x++) cnt[x] += src[ra + x]; }
    if (rem >= 0) { const rr = rem * w; for (let x = 0; x < w; x++) cnt[x] -= src[rr + x]; }
  }
  return out;
}
const dilate = (m, w, h, r) => r <= 0 ? m : windowCol(windowRow(m, w, h, r, r, false), w, h, r, r, false);
function openK(m, w, h, k) {
  // k×k の開処理。差分マスクは疎なので、1 の画素だけを見る
  if (k <= 1) return m;
  const e = new Uint8Array(w * h), out = new Uint8Array(w * h);
  for (let i = 0; i < m.length; i++) {
    if (!m[i]) continue;
    const x = i % w, y = (i - x) / w;
    if (x + k > w || y + k > h) continue;
    let all = 1;
    for (let dy = 0; dy < k && all; dy++) { const r = i + dy * w; for (let dx = 0; dx < k; dx++) if (!m[r + dx]) { all = 0; break; } }
    e[i] = all;
  }
  for (let i = 0; i < e.length; i++) {
    if (!e[i]) continue;
    for (let dy = 0; dy < k; dy++) { const r = i + dy * w; for (let dx = 0; dx < k; dx++) out[r + dx] = 1; }
  }
  return out;
}

// 面積 minArea 未満の連結成分（8近傍）を消す
function removeSmall(m, w, h, minArea) {
  const stack = [], comp = [];
  for (let i = 0; i < m.length; i++) {
    if (m[i] !== 1) continue;
    stack.length = 0; comp.length = 0;
    stack.push(i); m[i] = 2;
    while (stack.length) {
      const j = stack.pop(); comp.push(j);
      const x = j % w, y = (j - x) / w;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy; if (yy < 0 || yy >= h) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx; if (xx < 0 || xx >= w) continue;
          const k = yy * w + xx;
          if (m[k] === 1) { m[k] = 2; stack.push(k); }
        }
      }
    }
    if (comp.length < minArea) for (const j of comp) m[j] = 3; // 3 = 削除予定
  }
  for (let i = 0; i < m.length; i++) m[i] = m[i] === 2 ? 1 : 0;
  return m;
}

// ---------- 位置合わせ（チャンファーマッチング, 粗→細） ----------
function maxPool(m, w, h, f) {
  const sw = Math.ceil(w / f), sh = Math.ceil(h / f), out = new Uint8Array(sw * sh);
  const xm = new Int32Array(w); for (let x = 0; x < w; x++) xm[x] = (x / f) | 0;
  for (let y = 0; y < h; y++) {
    const r = y * w, sr = ((y / f) | 0) * sw;
    for (let x = 0; x < w; x++) if (m[r + x]) out[sr + xm[x]] = 1;
  }
  return { m: out, w: sw, h: sh };
}
function chamferDT(m, w, h, cap) {
  const d = new Float32Array(w * h), D = Math.SQRT2;
  for (let i = 0; i < d.length; i++) d[i] = m[i] ? 0 : cap;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x; let v = d[i];
    if (x > 0 && d[i - 1] + 1 < v) v = d[i - 1] + 1;
    if (y > 0) {
      if (d[i - w] + 1 < v) v = d[i - w] + 1;
      if (x > 0 && d[i - w - 1] + D < v) v = d[i - w - 1] + D;
      if (x < w - 1 && d[i - w + 1] + D < v) v = d[i - w + 1] + D;
    }
    d[i] = v;
  }
  for (let y = h - 1; y >= 0; y--) for (let x = w - 1; x >= 0; x--) {
    const i = y * w + x; let v = d[i];
    if (x < w - 1 && d[i + 1] + 1 < v) v = d[i + 1] + 1;
    if (y < h - 1) {
      if (d[i + w] + 1 < v) v = d[i + w] + 1;
      if (x < w - 1 && d[i + w + 1] + D < v) v = d[i + w + 1] + D;
      if (x > 0 && d[i + w - 1] + D < v) v = d[i + w - 1] + D;
    }
    d[i] = v;
  }
  return d;
}

function estimate(oldM, w, h, newM, nw, nh) {
  const cx = w / 2, cy = h / 2, long = Math.max(w, h);
  const fCoarse = Math.max(1, Math.ceil(long / 400));
  const fFine = Math.max(1, Math.ceil(long / 3000));
  const levels = [];
  for (let f = fCoarse; f > fFine; f = Math.ceil(f / 2)) levels.push(f);
  levels.push(fFine);
  const CAP = 8;

  let th = 0, tx = 0, ty = 0, finalCost = 0;
  levels.forEach((f, li) => {
    const o = maxPool(oldM, w, h, f);
    const dt = chamferDT(o.m, o.w, o.h, CAP);
    const n = maxPool(newM, nw, nh, f);
    const idx = []; for (let i = 0; i < n.m.length; i++) if (n.m[i]) idx.push(i);
    const maxPts = li === 0 ? 1500 : 20000;
    const step = Math.max(1, Math.floor(idx.length / maxPts));
    const px = [], py = [];
    for (let k = 0; k < idx.length; k += step) {
      const i = idx[k], x = i % n.w, y = (i - x) / n.w;
      px.push((x + 0.5) * f - cx); py.push((y + 0.5) * f - cy);
    }
    const N = px.length; if (!N) return;
    const ow = o.w, oh = o.h;
    const cost = (T, X, Y) => {
      const c = Math.cos(T), s = Math.sin(T);
      let sum = 0;
      for (let k = 0; k < N; k++) {
        const u = (c * px[k] - s * py[k] + cx + X) / f - 0.5;
        const v = (s * px[k] + c * py[k] + cy + Y) / f - 0.5;
        if (u < 0 || v < 0 || u >= ow - 1 || v >= oh - 1) { sum += CAP; continue; }
        const x0 = u | 0, y0 = v | 0, ax = u - x0, ay = v - y0, i = y0 * ow + x0;
        sum += (dt[i] * (1 - ax) + dt[i + 1] * ax) * (1 - ay) + (dt[i + ow] * (1 - ax) + dt[i + ow + 1] * ax) * ay;
      }
      return sum / N;
    };
    if (li === 0) {
      // 粗い全探索: ±15% の平行移動 × ±1.5° の回転
      let best = Infinity;
      const rx = Math.round(0.15 * w / f), ry = Math.round(0.15 * h / f);
      for (let a = -6; a <= 6; a++) {
        const T = a * 0.25 * Math.PI / 180;
        for (let j = -ry; j <= ry; j++) for (let i = -rx; i <= rx; i++) {
          const c = cost(T, i * f, j * f);
          if (c < best) { best = c; th = T; tx = i * f; ty = j * f; }
        }
      }
    }
    // 局所探索（山登り）。刻みを半分ずつ細かくする
    let cur = cost(th, tx, ty);
    for (let sc = 1; sc >= 0.25; sc /= 2) {
      const ts = f * sc, as = ts / (long / 2);
      for (let it = 0; it < 400; it++) {
        const cand = [[th, tx + ts, ty], [th, tx - ts, ty], [th, tx, ty + ts], [th, tx, ty - ts], [th + as, tx, ty], [th - as, tx, ty]];
        let bi = -1, bc = cur;
        for (let k = 0; k < cand.length; k++) { const c = cost(cand[k][0], cand[k][1], cand[k][2]); if (c < bc - 1e-9) { bc = c; bi = k; } }
        if (bi < 0) break;
        [th, tx, ty] = cand[bi]; cur = bc;
      }
    }
    finalCost = cur;
    prog('位置合わせ中…', 20 + Math.round(25 * (li + 1) / levels.length));
  });
  return { th, tx, ty, cx, cy, cost: finalCost };
}

// 新版を旧版の座標系へ（双線形補間, はみ出しは白）
function warp(src, sw, sh, w, h, T) {
  const out = new Uint8Array(w * h);
  const c = Math.cos(T.th), s = Math.sin(T.th);
  for (let y = 0; y < h; y++) {
    const dy = y - T.cy - T.ty;
    let X = c * (-T.cx - T.tx) + s * dy + T.cx;
    let Y = -s * (-T.cx - T.tx) + c * dy + T.cy;
    const r = y * w;
    for (let x = 0; x < w; x++, X += c, Y -= s) {
      if (X < 0 || Y < 0 || X >= sw - 1 || Y >= sh - 1) { out[r + x] = 255; continue; }
      const x0 = X | 0, y0 = Y | 0, ax = X - x0, ay = Y - y0, i = y0 * sw + x0;
      out[r + x] = ((src[i] * (1 - ax) + src[i + 1] * ax) * (1 - ay) + (src[i + sw] * (1 - ax) + src[i + sw + 1] * ax) * ay + 0.5) | 0;
    }
  }
  return out;
}

// ---------- 変更箇所のまとめ ----------
function findRegions(removed, added, w, h, p) {
  const f = 4;
  const both = new Uint8Array(w * h);
  for (let i = 0; i < both.length; i++) both[i] = removed[i] | added[i];
  const S = maxPool(both, w, h, f);
  const r = Math.max(1, Math.round(p.cluster / f));
  const D = dilate(S.m, S.w, S.h, r);
  const seen = new Uint8Array(D.length);
  const regs = [];
  const stack = [];
  for (let i = 0; i < D.length; i++) {
    if (!D[i] || seen[i]) continue;
    let x0 = Infinity, y0 = Infinity, x1 = -1, y1 = -1;
    stack.length = 0; stack.push(i); seen[i] = 1;
    while (stack.length) {
      const j = stack.pop(), x = j % S.w, y = (j - x) / S.w;
      if (S.m[j]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy; if (yy < 0 || yy >= S.h) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx; if (xx < 0 || xx >= S.w) continue;
          const k = yy * S.w + xx;
          if (D[k] && !seen[k]) { seen[k] = 1; stack.push(k); }
        }
      }
    }
    if (x1 < 0) continue;
    const bx0 = Math.max(0, x0 * f - p.pad), by0 = Math.max(0, y0 * f - p.pad);
    const bx1 = Math.min(w, (x1 + 1) * f + p.pad), by1 = Math.min(h, (y1 + 1) * f + p.pad);
    let rp = 0, ap = 0;
    for (let y = by0; y < by1; y++) { const rr = y * w; for (let x = bx0; x < bx1; x++) { rp += removed[rr + x]; ap += added[rr + x]; } }
    regs.push({ x: bx0, y: by0, w: bx1 - bx0, h: by1 - by0, removed: rp, added: ap });
  }
  const band = Math.max(1, Math.floor(h / 40));
  regs.sort((a, b) => (Math.floor(a.y / band) - Math.floor(b.y / band)) || (a.x - b.x));
  return regs;
}

// ---------- メイン ----------
function run({ oldG, newG, w, h, nw, nh, p }) {
  const t0 = Date.now();
  prog('線を抽出中…', 8);
  const oldM = inkMask(oldG, w, h, p);
  let T = { th: 0, tx: 0, ty: 0, cx: w / 2, cy: h / 2, cost: 0 }, aligned = false;
  if (p.align) {
    prog('位置合わせ中…', 15);
    const nM = inkMask(newG, nw, nh, p);
    T = estimate(oldM, w, h, nM, nw, nh);
    aligned = true;
  }
  prog('新版を重ね合わせ中…', 50);
  const warped = warp(newG, nw, nh, w, h, T);
  const newM = inkMask(warped, w, h, p);

  prog('差分を計算中…', 62);
  const oldD = dilate(oldM, w, h, p.tolerance);
  const newD = dilate(newM, w, h, p.tolerance);
  let removed = new Uint8Array(w * h), added = new Uint8Array(w * h);
  for (let i = 0; i < removed.length; i++) { removed[i] = oldM[i] & (newD[i] ^ 1); added[i] = newM[i] & (oldD[i] ^ 1); }
  prog('ノイズを除去中…', 72);
  removed = removeSmall(openK(removed, w, h, p.openK), w, h, p.minArea);
  added = removeSmall(openK(added, w, h, p.openK), w, h, p.minArea);

  prog('変更箇所をまとめ中…', 82);
  const regions = findRegions(removed, added, w, h, p);

  prog('画像を合成中…', 90);
  const rgba = new Uint8ClampedArray(w * h * 4);
  rgba.fill(255);
  const rv = dilate(removed, w, h, p.emph), av = dilate(added, w, h, p.emph);
  let rc = 0, ac = 0;
  for (let i = 0, j = 0; i < removed.length; i++, j += 4) {
    rc += removed[i]; ac += added[i];
    if (av[i]) { rgba[j] = 0; rgba[j + 1] = 90; rgba[j + 2] = 230; }
    else if (rv[i]) { rgba[j] = 230; rgba[j + 1] = 0; rgba[j + 2] = 0; }
    else if (oldM[i] | newM[i]) { rgba[j] = 200; rgba[j + 1] = 200; rgba[j + 2] = 200; }
  }
  post({
    type: 'done', w, h, rgba: rgba.buffer, regions,
    stats: { removed: rc, added: ac, ms: Date.now() - t0 },
    align: { aligned, dx: T.tx, dy: T.ty, deg: T.th * 180 / Math.PI },
  }, [rgba.buffer]);
}
</script>

<script>
'use strict';
(() => {
  const $ = (id) => document.getElementById(id);
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdfjs-3.11.174/pdf.worker.min.js';

  const PRESETS = {
    standard:  { tolerance: 3, minArea: 30, openK: 2 },
    sensitive: { tolerance: 2, minArea: 10, openK: 0 },
    robust:    { tolerance: 5, minArea: 100, openK: 3 },
  };
  const MAX_PIXELS = 80e6;    // 1ページの上限画素数（メモリ保護）
  const MAX_SIDE = 32000;     // ブラウザのキャンバス辺長の上限

  const state = { old: null, neu: null, oldName: '', newName: '', pageCount: 0, result: null, zoom: 1, busy: false };

  // ---------- ファイル選択 ----------
  function setupDrop(dropId, inputId, nameId, key) {
    const drop = $(dropId), input = $(inputId);
    input.addEventListener('change', () => input.files[0] && loadPdf(input.files[0], key, nameId, drop));
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault(); drop.classList.remove('over');
      const f = e.dataTransfer.files[0]; if (f) loadPdf(f, key, nameId, drop);
    });
  }
  async function loadPdf(file, key, nameId, drop) {
    hideNotices();
    try {
      const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
      if (state[key]) state[key].destroy();
      state[key] = doc;
      state[key === 'old' ? 'oldName' : 'newName'] = file.name;
      $(nameId).textContent = `${file.name}（${doc.numPages}ページ）`;
      drop.classList.add('ready');
      refreshPages();
    } catch (e) {
      showErr(`PDFを開けませんでした: ${file.name}`);
    }
  }
  function refreshPages() {
    const ready = state.old && state.neu;
    $('run').disabled = !ready || state.busy;
    $('runHint').textContent = ready ? '' : '旧版と新版の両方を選んでください';
    if (!ready) return;
    const n = Math.min(state.old.numPages, state.neu.numPages);
    state.pageCount = n;
    const sel = $('page'); sel.innerHTML = '';
    for (let i = 1; i <= n; i++) sel.add(new Option(`${i} ページ目`, i));
    sel.disabled = n <= 1;
    if (state.old.numPages !== state.neu.numPages)
      showWarn(`ページ数が違います（旧版 ${state.old.numPages} / 新版 ${state.neu.numPages}）。先頭から ${n} ページ分を比較できます。`);
  }

  // ---------- プリセット ----------
  $('presets').addEventListener('click', (e) => {
    const b = e.target.closest('.preset'); if (!b) return;
    for (const x of document.querySelectorAll('.preset')) x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
    const p = PRESETS[b.dataset.preset];
    $('tolerance').value = p.tolerance; $('minArea').value = p.minArea; $('openK').value = p.openK;
  });

  // ---------- 実行 ----------
  async function renderGray(doc, pageNo, scale) {
    const page = await doc.getPage(pageNo);
    const vp = page.getViewport({ scale });
    const w = Math.floor(vp.width), h = Math.floor(vp.height);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'); // willReadFrequently を付けると描画が数倍遅くなる
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const gray = new Uint8Array(w * h);
    const BAND = 512; // 一度に読む行数（メモリのピークを抑える）
    for (let y0 = 0; y0 < h; y0 += BAND) {
      const bh = Math.min(BAND, h - y0), d = ctx.getImageData(0, y0, w, bh).data, off = y0 * w;
      for (let i = 0, j = 0; i < w * bh; i++, j += 4) gray[off + i] = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8;
    }
    cv.width = cv.height = 0;
    page.cleanup();
    return { gray, w, h };
  }

  function chooseScale(p1, p2, dpi) {
    let s = dpi / 72;
    for (const v of [p1, p2]) {
      s = Math.min(s, Math.sqrt(MAX_PIXELS / (v.width * v.height)), MAX_SIDE / v.width, MAX_SIDE / v.height);
    }
    return s;
  }

  async function run(pageNo) {
    if (state.busy || !state.old || !state.neu) return;
    state.busy = true; $('run').disabled = true; setNavDisabled(true);
    hideNotices();
    setProgress('図面を画像に変換中…', 2);
    try {
      const dpi = +$('dpi').value;
      const [po, pn] = await Promise.all([state.old.getPage(pageNo), state.neu.getPage(pageNo)]);
      const s = chooseScale(po.getViewport({ scale: 1 }), pn.getViewport({ scale: 1 }), dpi);
      const effDpi = Math.round(s * 72);
      if (effDpi < dpi) showWarn(`図面が大きいため、解像度を ${dpi} → ${effDpi} dpi に下げて処理しています。`);
      const k = effDpi / 300; // 数値パラメータは 300dpi 基準
      const p = {
        dpi: effDpi,
        blur: true,
        threshold: +$('threshold').value || 0,
        tolerance: Math.round(+$('tolerance').value * k),
        minArea: Math.round(+$('minArea').value * k * k),
        openK: Math.round(+$('openK').value * k),
        cluster: Math.max(4, Math.round(+$('cluster').value * k)),
        pad: Math.round(15 * k),
        emph: Math.max(1, Math.round(1 * k)),
        align: $('align').value === '1',
      };
      // 旧版と新版は別々の pdf.js ワーカーで解読されるので並列に変換する
      const [o, n] = await Promise.all([renderGray(state.old, pageNo, s), renderGray(state.neu, pageNo, s)]);
      const res = await runWorker({ oldG: o.gray, newG: n.gray, w: o.w, h: o.h, nw: n.w, nh: n.h, p }, [o.gray.buffer, n.gray.buffer]);
      res.page = pageNo; res.dpi = effDpi;
      showResult(res);
    } catch (e) {
      console.error(e);
      const msg = String(e && e.message || e);
      showErr(/memory|allocation|Array buffer|Invalid array length/i.test(msg)
        ? 'メモリが足りませんでした。解像度を下げて（200dpi など）もう一度お試しください。'
        : `処理中にエラーが発生しました: ${msg}`);
    } finally {
      state.busy = false; $('run').disabled = !(state.old && state.neu);
      $('progress').classList.remove('on');
      setNavDisabled(false);
    }
  }

  let workerUrl = null;
  function runWorker(msg, transfer) {
    if (!workerUrl) workerUrl = URL.createObjectURL(new Blob([$('workerSrc').textContent], { type: 'text/javascript' }));
    return new Promise((resolve, reject) => {
      const wk = new Worker(workerUrl);
      wk.onmessage = (e) => {
        const d = e.data;
        if (d.type === 'progress') setProgress(d.msg, d.pct);
        else if (d.type === 'done') { wk.terminate(); resolve(d); }
        else if (d.type === 'error') { wk.terminate(); reject(new Error(d.message)); }
      };
      wk.onerror = (e) => { wk.terminate(); reject(new Error(e.message || 'Worker error')); };
      wk.postMessage(msg, transfer);
    });
  }

  // ---------- 結果表示 ----------
  const canvas = $('canvas'), vpEl = $('viewport');

  function showResult(r) {
    state.result = r;
    canvas.width = r.w; canvas.height = r.h;
    const ctx = canvas.getContext('2d');
    ctx.putImageData(new ImageData(new Uint8ClampedArray(r.rgba), r.w, r.h), 0, 0);
    r.rgba = null;
    drawBoxes(ctx, r);
    drawLegend(ctx, r);

    const nR = r.regions.filter((g) => g.removed && !g.added).length;
    const nA = r.regions.filter((g) => g.added && !g.removed).length;
    const nC = r.regions.length - nR - nA;
    const a = r.align;
    $('summary').innerHTML = `
      <div class="stat"><b>${r.regions.length}</b><span>変更箇所（${r.page}/${state.pageCount} ページ）</span></div>
      <div class="stat"><b style="color:var(--removed)">${nR}</b><span>削除</span></div>
      <div class="stat"><b style="color:var(--added)">${nA}</b><span>追加</span></div>
      <div class="stat"><b style="color:#7a3db8">${nC}</b><span>変更（削除＋追加）</span></div>
      <div class="stat"><b style="font-size:14px;line-height:1.9">${a.aligned ? `ズレ補正 ${fmtShift(a, r.dpi)}` : '位置合わせなし'}</b><span>${r.dpi} dpi・${(r.stats.ms / 1000).toFixed(1)} 秒</span></div>`;
    if (r.regions.length > 300)
      showWarn('変更箇所がとても多く検出されました。位置合わせがうまくいっていない可能性があります。「ノイズに強く」を選ぶか、詳細設定の「ズレの許容幅」を上げてください。');

    renderList(r);
    $('overlay').innerHTML = r.regions.map((g, i) =>
      `<div class="ob" data-i="${i}" style="left:${g.x / r.w * 100}%;top:${g.y / r.h * 100}%;width:${g.w / r.w * 100}%;height:${g.h / r.h * 100}%"><span>${i + 1}</span></div>`).join('');
    $('result').classList.add('on');
    $('prevPage').disabled = r.page <= 1;
    $('nextPage').disabled = r.page >= state.pageCount;
    $('page').value = r.page;
    // 横長の図面で下に大きな余白ができないよう、表示枠の高さを図面に合わせる
    const fitH = r.h * (vpEl.clientWidth / r.w) + 4;
    vpEl.style.height = `${Math.round(Math.max(320, Math.min(window.innerHeight * 0.7, fitH)))}px`;
    requestAnimationFrame(() => { zoomFit(); $('result').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  }
  function fmtShift(a, dpi) {
    const mm = (v) => (v * 25.4 / dpi).toFixed(1);
    return `${mm(a.dx)}, ${mm(a.dy)} mm / ${a.deg.toFixed(2)}°`;
  }
  const kindOf = (g) => g.removed && g.added ? ['changed', '変更'] : g.removed ? ['removed', '削除'] : ['added', '追加'];

  function drawBoxes(ctx, r) {
    const t = Math.max(2, Math.round(r.dpi / 100));
    const fs = Math.max(14, Math.round(r.dpi / 300 * 34));
    ctx.font = `bold ${fs}px system-ui, sans-serif`;
    ctx.textBaseline = 'alphabetic';
    r.regions.forEach((g, i) => {
      ctx.strokeStyle = '#ff9600'; ctx.lineWidth = t;
      ctx.strokeRect(g.x, g.y, g.w, g.h);
      const label = String(i + 1), tw = ctx.measureText(label).width;
      const ly = g.y - fs - 6 > 0 ? g.y - fs - 6 : g.y + g.h;
      ctx.fillStyle = '#ff9600'; ctx.fillRect(g.x - t / 2, ly, tw + 10, fs + 6);
      ctx.fillStyle = '#fff'; ctx.fillText(label, g.x + 5 - t / 2, ly + fs);
    });
  }
  function drawLegend(ctx, r) {
    const s = r.dpi / 300, fs = Math.round(26 * s), pad = Math.round(14 * s), lh = Math.round(38 * s);
    const items = [['削除（旧版のみ）', '#e60000'], ['追加（新版のみ）', '#005ae6'], ['変更なし', '#c8c8c8'], [`変更箇所 ${r.regions.length} 件`, '#ff9600']];
    const W = Math.round(330 * s), H = lh * items.length + pad * 2;
    if (r.w < W * 3 || r.h < H * 2) return;
    ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fillRect(pad, pad, W, H);
    ctx.strokeStyle = '#666'; ctx.lineWidth = Math.max(1, Math.round(2 * s)); ctx.strokeRect(pad, pad, W, H);
    ctx.font = `${fs}px system-ui, sans-serif`; ctx.textBaseline = 'middle';
    items.forEach(([t, c], i) => {
      const cy = pad * 2 + lh * i + lh / 2;
      ctx.fillStyle = c; ctx.fillRect(pad * 2, cy - lh / 4, lh, lh / 2);
      ctx.fillStyle = '#222'; ctx.fillText(t, pad * 3 + lh, cy);
    });
  }

  function renderList(r) {
    const el = $('list');
    if (!r.regions.length) { el.innerHTML = '<div class="empty">差分は見つかりませんでした。</div>'; return; }
    const mm = (v) => (v * 25.4 / r.dpi).toFixed(0);
    el.innerHTML = `<table><thead><tr><th>No</th><th>種別</th><th>位置 (x, y)</th><th>大きさ</th></tr></thead><tbody>${
      r.regions.map((g, i) => {
        const [c, t] = kindOf(g);
        return `<tr data-i="${i}"><td class="num">${i + 1}</td><td><span class="chip ${c}">${t}</span></td><td class="num">${mm(g.x)}, ${mm(g.y)}</td><td class="num">${mm(g.w)}×${mm(g.h)}</td></tr>`;
      }).join('')}</tbody></table>`;
  }
  $('list').addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-i]'); if (!tr) return;
    for (const x of $('list').querySelectorAll('tr.sel')) x.classList.remove('sel');
    tr.classList.add('sel');
    for (const x of $('overlay').querySelectorAll('.ob')) x.classList.toggle('sel', x.dataset.i === tr.dataset.i);
    focusRegion(state.result.regions[+tr.dataset.i]);
  });

  // ---------- ズーム・移動 ----------
  function setZoom(z, cx, cy) {
    const r = state.result; if (!r) return;
    const minZ = Math.min(1, (vpEl.clientWidth) / r.w, (vpEl.clientHeight) / r.h);
    z = Math.max(minZ * 0.5, Math.min(4, z));
    // 画面上の (cx, cy) の位置を保ったまま拡大縮小
    if (cx === undefined) { cx = vpEl.clientWidth / 2; cy = vpEl.clientHeight / 2; }
    const ix = (vpEl.scrollLeft + cx) / state.zoom, iy = (vpEl.scrollTop + cy) / state.zoom;
    state.zoom = z;
    canvas.style.width = `${Math.round(r.w * z)}px`;
    canvas.style.height = `${Math.round(r.h * z)}px`;
    vpEl.scrollLeft = ix * z - cx; vpEl.scrollTop = iy * z - cy;
    $('zoomVal').textContent = `${Math.round(z * 100)}%`;
    // 縮小表示では画像に描いた枠が細すぎて見えないので、画面上の太さが一定の枠を重ねる
    $('overlay').classList.toggle('off', z >= 0.5);
  }
  function zoomFit() {
    const r = state.result; if (!r) return;
    state.zoom = 1;
    setZoom(Math.min(vpEl.clientWidth / r.w, vpEl.clientHeight / r.h) * 0.98);
    vpEl.scrollLeft = 0; vpEl.scrollTop = 0;
  }
  function focusRegion(g) {
    const z = Math.min(2, Math.max(0.15, Math.min(vpEl.clientWidth / (g.w * 3), vpEl.clientHeight / (g.h * 3))));
    setZoom(z);
    vpEl.scrollLeft = (g.x + g.w / 2) * z - vpEl.clientWidth / 2;
    vpEl.scrollTop = (g.y + g.h / 2) * z - vpEl.clientHeight / 2;
  }
  $('zoomFit').onclick = zoomFit;
  $('zoom100').onclick = () => setZoom(1);
  $('zoomIn').onclick = () => setZoom(state.zoom * 1.5);
  $('zoomOut').onclick = () => setZoom(state.zoom / 1.5);
  vpEl.addEventListener('wheel', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const rect = vpEl.getBoundingClientRect();
    setZoom(state.zoom * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX - rect.left, e.clientY - rect.top);
  }, { passive: false });
  let drag = null;
  vpEl.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, sl: vpEl.scrollLeft, st: vpEl.scrollTop }; vpEl.classList.add('drag'); vpEl.setPointerCapture(e.pointerId); });
  vpEl.addEventListener('pointermove', (e) => { if (!drag) return; vpEl.scrollLeft = drag.sl - (e.clientX - drag.x); vpEl.scrollTop = drag.st - (e.clientY - drag.y); });
  const endDrag = () => { drag = null; vpEl.classList.remove('drag'); };
  vpEl.addEventListener('pointerup', endDrag); vpEl.addEventListener('pointercancel', endDrag);

  // ---------- 保存 ----------
  const baseName = () => `差分_${state.oldName.replace(/\.pdf$/i, '')}_vs_${state.newName.replace(/\.pdf$/i, '')}_p${state.result.page}`;
  function download(blob, name) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }
  $('dlPng').onclick = () => {
    const b = $('dlPng'); b.disabled = true; b.textContent = '保存中…';
    canvas.toBlob((blob) => { b.disabled = false; b.textContent = '画像を保存 (PNG)'; if (blob) download(blob, `${baseName()}.png`); else showErr('画像を保存できませんでした（大きすぎる可能性があります）。'); }, 'image/png');
  };
  $('dlCsv').onclick = () => {
    const r = state.result, mm = (v) => (v * 25.4 / r.dpi).toFixed(1);
    const rows = [['ページ', 'No', '種別', 'x_mm', 'y_mm', '幅_mm', '高さ_mm', '削除px', '追加px']];
    r.regions.forEach((g, i) => rows.push([r.page, i + 1, kindOf(g)[1], mm(g.x), mm(g.y), mm(g.w), mm(g.h), g.removed, g.added]));
    download(new Blob(['﻿' + rows.map((x) => x.join(',')).join('\r\n')], { type: 'text/csv' }), `${baseName()}.csv`);
  };

  // ---------- ページ移動 ----------
  function setNavDisabled(d) {
    const r = state.result;
    $('prevPage').disabled = d || !r || r.page <= 1;
    $('nextPage').disabled = d || !r || r.page >= state.pageCount;
  }
  $('prevPage').onclick = () => run(state.result.page - 1);
  $('nextPage').onclick = () => run(state.result.page + 1);
  $('run').onclick = () => run(+$('page').value || 1);

  // ---------- 表示ヘルパー ----------
  function setProgress(msg, pct) { $('progress').classList.add('on'); $('progMsg').textContent = msg; $('barFill').style.width = `${pct}%`; }
  function showWarn(m) { const e = $('warn'); e.textContent = m; e.classList.add('on'); }
  function showErr(m) { const e = $('err'); e.textContent = m; e.classList.add('on'); }
  function hideNotices() { $('warn').classList.remove('on'); $('err').classList.remove('on'); }

  setupDrop('dropOld', 'fileOld', 'nameOld', 'old');
  setupDrop('dropNew', 'fileNew', 'nameNew', 'neu');
})();
</script>
</body>
</html>
