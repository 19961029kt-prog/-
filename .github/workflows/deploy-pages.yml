name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/serene-curie-kfoyO
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Copy standalone static pages
        # index.html/sasebo.html/gmap.html/kyushu.html はVite側でビルド済みのものをdistに出力しているため
        # ここでは上書きせず、Viteのビルド対象に含まれていない単独の静的HTMLだけをdistにコピーする
        run: |
          for f in *.html; do
            case "$f" in
              index.html|sasebo.html|gmap.html|kyushu.html) ;;
              *) cp "$f" dist/ ;;
            esac
          done
      - name: Copy よか旅すごろく九州 (standalone static site)
        # yokatabi/ はビルド不要の静的サイト。開発用の tools/ と CLAUDE.md は公開しない
        run: |
          node yokatabi/tools/build-fallback.mjs --check
          node yokatabi/tools/test-trip.mjs
          cp -r yokatabi dist/yokatabi
          rm -rf dist/yokatabi/tools dist/yokatabi/CLAUDE.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
